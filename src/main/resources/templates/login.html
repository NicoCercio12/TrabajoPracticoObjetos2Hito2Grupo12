<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header card-header-eg">Iniciar sesión</div>
                <div class="card-body p-4">

                    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
                    <div th:if="${param.registrada}" class="alert alert-success">
                        Unidad registrada. Iniciá sesión de nuevo para activar tu rol de responsable.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                    <div th:if="${param.logout}" class="alert alert-info">Cerraste sesión.</div>

                    <form th:action="@{/loginprocess}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Email o usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <hr>
                    <p class="text-center small mb-0">
                        ¿No tenés cuenta? <a th:href="@{/signup}">Crear cuenta</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
