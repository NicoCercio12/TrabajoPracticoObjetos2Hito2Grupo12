<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Epicentro Gourmet</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-dark: #080b11;
            --bg-card: rgba(18, 24, 38, 0.88);
            --coral-primary: #ff4d2d;
            --coral-hover: #ff3410;
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-card: rgba(255, 255, 255, 0.12);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 85% 15%, rgba(255, 77, 45, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Navbar Unificada */
        .navbar-custom {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(10px);
        }

        /* Contenedor y Card Central */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }

        .auth-card-header {
            padding: 30px 30px 10px;
            text-align: center;
        }

        .badge-kicker {
            color: #ff6448;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        /* Formularios y Controles */
        .form-label {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control-custom {
            background-color: #0b111a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #0d1522;
            border-color: var(--coral-primary);
            box-shadow: 0 0 0 3px rgba(255, 77, 45, 0.25);
            color: #ffffff;
            outline: none;
        }

        .form-control-custom::placeholder {
            color: #64748b;
        }

        /* Alertas de Estado */
        .alert-custom-success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
            font-size: 0.88rem;
            border-radius: 10px;
        }

        .alert-custom-danger {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            font-size: 0.88rem;
            border-radius: 10px;
        }

        .alert-custom-info {
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #bae6fd;
            font-size: 0.88rem;
            border-radius: 10px;
        }

        /* Botón Submit */
        .btn-palo-primary {
            background-color: var(--coral-primary);
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 50px;
            border: none;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(255, 77, 45, 0.35);
            margin-top: 10px;
        }

        .btn-palo-primary:hover {
            background-color: var(--coral-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 77, 45, 0.45);
        }

        /* Enlaces secundarios */
        .auth-footer-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .auth-footer-link a {
            color: #ff6448;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer-link a:hover {
            text-decoration: underline;
            color: #ff856e;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom py-3">
    <div class="container">
        <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="/">
            <span style="color: var(--coral-primary); font-size: 1.4rem;">❖</span> EPICENTRO GOURMET
        </a>
        <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="/" style="border-color: rgba(255,255,255,0.25); color: #cbd5e1;">
            <i class="bi bi-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>
</nav>

<main class="auth-container">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="badge-kicker">
                <i class="bi bi-shield-lock-fill"></i> SEGURIDAD Y ACCESO
            </div>
            <h3 class="fw-bold text-white mb-2">Iniciar sesión</h3>
            <p class="text-secondary small mb-0">Ingresá a tu panel de control de festivales</p>
        </div>

        <div class="card-body p-4 pt-3">
            <!-- Mensajes y Alertas Spring Security -->
            <div th:if="${mensaje}" class="alert alert-custom-success mb-3 p-3" th:text="${mensaje}"></div>
            <div th:if="${param.registrada}" class="alert alert-custom-success mb-3 p-3">
                <i class="bi bi-check-circle me-1"></i> Unidad registrada. Iniciá sesión de nuevo para activar tu rol de responsable.
            </div>
            <div th:if="${param.error}" class="alert alert-custom-danger mb-3 p-3">
                <i class="bi bi-exclamation-triangle me-1"></i> Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-custom-info mb-3 p-3">
                <i class="bi bi-info-circle me-1"></i> Cerraste sesión correctamente.
            </div>

            <form th:action="@{/loginprocess}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Email o usuario</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" 
                           placeholder="nombre@ejemplo.com" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" 
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-palo-primary">
                    Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
            </form>

            <div class="auth-footer-link text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                ¿No tenés cuenta aún? 
                <a th:href="@{/signup}">Crear cuenta</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
