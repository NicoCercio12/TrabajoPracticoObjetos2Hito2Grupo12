<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis unidades')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div class="card shadow-sm">
        <div class="card-header-eg">
            Mis unidades de venta
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre Comercial</th>
                        <th>Tipo</th>
                        <th>Patente</th>
                        <th>Electricidad</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="u : ${unidades}">
                        <td th:text="${u.id}"></td>

                        <td th:text="${u.codigoUnico}"></td>

                        <td th:text="${u.nombreComercial}"></td>

                        <td th:text="${u.class.simpleName == 'FoodTruck' ? 'Food truck' : 'Puesto desarmable'}"></td>

                        <!-- patente existe solo en FoodTruck -->
                        <td th:text="${u.class.simpleName == 'FoodTruck' ? u.patente : '-'}"></td>

                        <td>
    <span th:if="${u.class.simpleName == 'FoodTruck'}"
          class="badge"
          th:classappend="${u.requiereElectricidad} ? 'bg-success' : 'bg-secondary'"
          th:text="${u.requiereElectricidad} ? 'Sí' : 'No'">
    </span>
                            <span th:unless="${u.class.simpleName == 'FoodTruck'}" class="text-muted">-</span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(unidades)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No tenés unidades de venta registradas.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
