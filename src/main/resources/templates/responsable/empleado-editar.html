<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar empleado | Epicentro Gourmet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #080b11;
            color: #f8fafc;
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        .barra {
            background: #0b1019;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .marca {
            color: #ff6448;
            font-weight: 800;
            text-decoration: none;
        }

        .panel {
            background: rgba(18, 24, 38, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: clamp(20px, 4vw, 36px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        }

        .form-control {
            background-color: #0b1019;
            border-color: #475569;
            color: #f8fafc;
            color-scheme: dark;
        }

        .form-control:focus {
            background-color: #0b1019;
            color: #ffffff;
            border-color: #ff6448;
            box-shadow: 0 0 0 0.2rem rgba(255, 77, 45, 0.18);
        }

        .btn-coral {
            background-color: #ff4d2d;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 700;
        }

        .btn-coral:hover {
            background-color: #ff3410;
            color: #ffffff;
        }

        .texto-secundario {
            color: #cbd5e1;
        }
    </style>
</head>

<body>
<header class="barra py-3">
    <div class="container d-flex flex-wrap gap-2
                justify-content-between align-items-center">
        <a class="marca" th:href="@{/responsable}">
            EPICENTRO · RESPONSABLE
        </a>

        <span class="texto-secundario small"
              th:text="${username}"></span>
    </div>
</header>

<main class="container py-5" style="max-width: 900px;">

    <a class="btn btn-outline-light rounded-pill mb-4"
       th:href="@{/responsable/empleados}">
        ← Volver a empleados
    </a>

    <section class="panel">
        <h1 class="h3 fw-bold mb-2">Modificar empleado</h1>

        <p class="texto-secundario mb-4">
            Actualizá los datos personales del empleado.
            Su cuenta, tipo y unidad asignada se mantienen.
        </p>

        <form th:action="@{/responsable/empleados/{id}/editar(id=${idEmpleado})}"
              th:object="${empleadoDTO}"
              method="post">

            <div th:if="${#fields.hasAnyErrors()}"
                 class="alert alert-danger"
                 role="alert">
                <p class="fw-semibold mb-2">Revisá los siguientes datos:</p>
                <ul class="mb-0">
                    <li th:each="error : ${#fields.allErrors()}"
                        th:text="${error}"></li>
                </ul>
            </div>

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre"
                           type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           maxlength="255"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input id="apellido"
                           type="text"
                           class="form-control"
                           th:field="*{apellido}"
                           maxlength="255"
                           required>
                </div>

                <div class="col-12">
                    <label for="dni" class="form-label">DNI</label>
                    <input id="dni"
                           type="text"
                           class="form-control"
                           th:field="*{dni}"
                           maxlength="255"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="fechaNacimiento" class="form-label">
                        Fecha de nacimiento
                    </label>
                    <input id="fechaNacimiento"
                           type="date"
                           class="form-control"
                           th:field="*{fechaNacimiento}"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="fechaIngreso" class="form-label">
                        Fecha de ingreso
                    </label>
                    <input id="fechaIngreso"
                           type="date"
                           class="form-control"
                           th:field="*{fechaIngreso}"
                           required>
                </div>
            </div>

            <p class="texto-secundario small mt-4">
                Modificar la fecha de ingreso puede afectar
                el cálculo de antigüedad y las consultas de festivales.
            </p>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-coral">
                    Guardar cambios
                </button>

                <a class="btn btn-outline-light rounded-pill px-4"
                   th:href="@{/responsable/empleados}">
                    Cancelar
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
