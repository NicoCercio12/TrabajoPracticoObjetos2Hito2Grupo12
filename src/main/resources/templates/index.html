<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">

    <section class="hero mb-5">
        <h1>Festivales gastronómicos</h1>
        <p class="lead mb-4">Gestioná unidades de venta, personal y rendimiento de cada jornada del predio ferial.</p>

        <div th:if="${!logueado}" class="d-flex flex-wrap gap-2">
            <a class="btn btn-eg btn-lg" th:href="@{/signup}">Crear cuenta</a>
            <a class="btn btn-outline-light btn-lg" th:href="@{/login}">Iniciar sesión</a>
        </div>

        <div th:if="${logueado}">
            <p class="mb-3">Hola, <b th:text="${username}"></b>.</p>
            <a th:if="${#lists.contains(roles, 'ROLE_PENDIENTE')}"
               class="btn btn-eg btn-lg" th:href="@{/registro}">Registrar mi unidad de venta</a>
        </div>
    </section>

    <div class="card">
        <div class="card-header card-header-eg">Festivales</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Nombre</th><th>Temporada</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${festivales}">
                    <td class="fw-semibold" th:text="${f.nombre}"></td>
                    <td th:text="${f.temporada}"></td>
                    <td th:text="${#temporals.format(f.fechaInicio, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(f.fechaFin, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:if="${f.estaActivo()}" class="badge text-bg-success">En curso</span>
                        <span th:unless="${f.estaActivo()}" class="badge text-bg-secondary">Fuera de fecha</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(festivales)}">
                    <td colspan="5" class="text-center text-muted py-4">Todavía no hay festivales cargados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
