<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cuenta pendiente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header card-header-eg">Tu cuenta está pendiente</div>
                <div class="card-body p-4 text-center">
                    <p class="lead mb-3">Tu cuenta fue creada correctamente.</p>
                    <p class="text-muted mb-4">
                        Un administrador tiene que aprobarla antes de que puedas registrar tu unidad de venta.
                        Cuando esté aprobada, cerrá sesión y volvé a entrar.
                    </p>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
