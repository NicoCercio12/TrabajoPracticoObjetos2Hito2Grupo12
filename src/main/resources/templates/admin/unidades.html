<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Unidades de venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-3">Todas las unidades de venta</h1>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre Comercial</th>
                <th>Tipo</th>
                <th>Responsable</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${unidades}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.codigoUnico}"></td>
                <td th:text="${u.nombreComercial}"></td>
                <td th:text="${u.class.simpleName}"></td>
                <td th:text="${u.responsable != null} ? ${u.responsable.nombre + ' ' + u.responsable.apellido} : '—'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(unidades)}">
                <td colspan="5" class="text-center text-muted">No hay unidades registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
