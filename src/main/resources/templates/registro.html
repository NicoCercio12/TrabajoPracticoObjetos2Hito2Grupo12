<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar unidad de venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 860px;">
    <h2 class="mb-1">Registrar unidad de venta</h2>
    <p class="text-muted mb-4">Cargá los datos de la unidad y de su responsable. Se asocian a la cuenta con la que iniciaste sesión.</p>

    <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
            <strong>Revisá estos datos:</strong>
            <ul class="mb-0">
                <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
            </ul>
        </div>

        <div class="card mb-4">
            <div class="card-header card-header-eg">1. Responsable</div>
            <div class="card-body">
                <div class="row g-3">
                    <div th:replace="~{fragments/layout :: campo('Nombre', 'nombre', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Apellido', 'apellido', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('DNI', 'dni', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Email', 'email', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Fecha de nacimiento', 'fechaNacimiento', 'date')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Fecha de ingreso', 'fechaIngreso', 'date')}"></div>

                    <div class="col-md-6">
                        <label class="form-label" for="tipoEmpleado">Tipo de empleado</label>
                        <select class="form-select" th:field="*{tipoEmpleado}" id="tipoEmpleado"
                                th:classappend="${#fields.hasErrors('tipoEmpleado')} ? 'is-invalid'">
                            <option value="">Elegir...</option>
                            <option th:each="t : ${tiposEmpleado}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipoEmpleado}"></div>
                    </div>
                    <div class="col-md-6" id="bloqueCocinero">
                        <label class="form-label" for="rolCocina">Rol en la cocina</label>
                        <select class="form-select" th:field="*{rolCocina}" id="rolCocina">
                            <option value="">Elegir...</option>
                            <option th:each="r : ${rolesCocina}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="col-md-6" id="bloqueCajero">
                        <label class="form-label" for="turno">Turno</label>
                        <select class="form-select" th:field="*{turno}" id="turno">
                            <option value="">Elegir...</option>
                            <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header card-header-eg">2. Unidad de venta</div>
            <div class="card-body">
                <div class="row g-3">
                    <div th:replace="~{fragments/layout :: campo('Nombre comercial', 'nombreComercial', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Código único (10 caracteres, empieza con FT o PD)', 'codigoUnico', 'text')}"></div>
                    <div th:replace="~{fragments/layout :: campo('Superficie (m²)', 'superficie', 'number')}"></div>

                    <div class="col-md-6">
                        <label class="form-label" for="tipoUnidad">Tipo de unidad</label>
                        <select class="form-select" th:field="*{tipoUnidad}" id="tipoUnidad"
                                th:classappend="${#fields.hasErrors('tipoUnidad')} ? 'is-invalid'">
                            <option value="">Elegir...</option>
                            <option th:each="t : ${tiposUnidad}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipoUnidad}"></div>
                    </div>

                    <div class="col-12" id="bloqueFoodTruck">
                        <div class="row g-3">
                            <div th:replace="~{fragments/layout :: campo('Patente', 'patente', 'text')}"></div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{requiereElectricidad}" id="requiereElectricidad">
                                    <label class="form-check-label" for="requiereElectricidad">Requiere conexión eléctrica</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12" id="bloquePuesto">
                        <div class="row g-3">
                            <div th:replace="~{fragments/layout :: campo('Cantidad de carpas', 'cantCarpas', 'number')}"></div>
                            <div th:replace="~{fragments/layout :: campo('Tiempo de montaje (minutos)', 'tiempoMontajeMinutos', 'number')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
            <a class="btn btn-outline-secondary btn-lg" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</main>

<script>
    function mostrar(id, visible) { document.getElementById(id).style.display = visible ? '' : 'none'; }
    function actualizar() {
        var te = document.getElementById('tipoEmpleado').value;
        var tu = document.getElementById('tipoUnidad').value;
        mostrar('bloqueCocinero', te === 'COCINERO');
        mostrar('bloqueCajero', te === 'CAJERO');
        mostrar('bloqueFoodTruck', tu === 'FOOD_TRUCK');
        mostrar('bloquePuesto', tu === 'PUESTO_DESARMABLE');
    }
    document.getElementById('tipoEmpleado').addEventListener('change', actualizar);
    document.getElementById('tipoUnidad').addEventListener('change', actualizar);
    document.addEventListener('DOMContentLoaded', actualizar);
    window.addEventListener('pageshow', actualizar);
    actualizar();
</script>
</body>
</html>
