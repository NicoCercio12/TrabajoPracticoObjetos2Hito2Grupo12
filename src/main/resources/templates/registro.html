<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieneResponsable} ? 'Registrar otra unidad | Epicentro Gourmet' : 'Registrar unidad | Epicentro Gourmet'">Registrar Unidad | Epicentro Gourmet</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-dark: #080b11;
            --bg-sidebar: #0b1019;
            --bg-card: rgba(18, 24, 38, 0.92);
            --coral-primary: #ff4d2d;
            --coral-hover: #ff3410;
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-subtle: rgba(255, 255, 255, 0.12);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 85% 15%, rgba(255, 77, 45, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* SIDEBAR */
        .admin-sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 22px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .sidebar-menu {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-sidebar-module {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.90rem;
            transition: all 0.2s ease;
        }

        .btn-sidebar-module:hover, .btn-sidebar-module.active {
            border-color: var(--coral-primary);
            background: rgba(255, 77, 45, 0.12);
            color: #ffffff;
            transform: translateX(3px);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 18px 20px;
            border-top: 1px solid var(--border-subtle);
        }

        /* MAIN */
        .admin-main {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .admin-topbar {
            height: 72px;
            background: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .badge-kicker {
            color: #ff6448;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .admin-content {
            padding: 35px 40px;
            max-width: 1000px;
        }

        /* CARD DEL FORMULARIO */
        .dark-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            overflow: hidden;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            margin-bottom: 24px;
        }

        .dark-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            font-weight: 700;
            color: #ffffff;
            font-size: 1.05rem;
        }

        /* INPUTS & SELECTS OSCUROS */
        .form-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.90rem;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.07);
            border-color: var(--coral-primary);
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 77, 45, 0.25);
        }

        .form-select option {
            background-color: #0b1019;
            color: #ffffff;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--coral-primary);
            border-color: var(--coral-primary);
        }

        .form-check-label {
            color: #ffffff;
            font-size: 0.90rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-palo-primary {
            background-color: var(--coral-primary);
            color: #ffffff;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 50px;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(255, 77, 45, 0.35);
            font-size: 0.88rem;
        }

        .btn-palo-primary:hover {
            background-color: var(--coral-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 45, 0.45);
        }

        .alert-danger-custom {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .alert-danger-custom strong {
            color: #ffffff;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="admin-sidebar">
    <a th:href="@{/responsable}" class="sidebar-brand">
        <span style="color: var(--coral-primary); font-size: 1.3rem;">❖</span>
        <span>EPICENTRO <span style="font-size: 0.7rem; color: #ff6448; font-weight: 600;">RESPONSABLE</span></span>
    </a>

    <div class="sidebar-menu">
        <div class="text-uppercase fw-bold mb-1 px-1" style="color: #64748b; font-size: 0.75rem; letter-spacing: 0.1em;">
            Operaciones
        </div>

        <a th:href="@{/responsable}" class="btn-sidebar-module">
            <i class="bi bi-grid-fill" style="color: #38bdf8;"></i>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/responsable/unidades}" class="btn-sidebar-module">
            <i class="bi bi-shop" style="color: #38bdf8;"></i>
            <span>Mis Unidades</span>
        </a>

        <a th:href="@{/registro}" class="btn-sidebar-module active">
            <i class="bi bi-plus-circle" style="color: var(--coral-primary);"></i>
            <span>Registrar Unidad</span>
        </a>

        <a th:href="@{/responsable/empleados}" class="btn-sidebar-module">
            <i class="bi bi-people-fill" style="color: #4ade80;"></i>
            <span>Personal Asignado</span>
        </a>
    </div>

    <!-- SESIÓN FOOTER -->
    <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
            <div class="text-truncate me-2">
                <div class="small fw-bold text-white text-truncate" th:text="${username != null ? username : 'responsable'}">responsable</div>
                <div style="font-size: 0.7rem; color: #ff6448;">RESPONSABLE</div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm rounded-circle p-2" title="Cerrar sesión">
                    <i class="bi bi-power"></i>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- MAIN WRAPPER -->
<div class="admin-main">
    
    <!-- TOPBAR -->
    <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
            <span class="badge-kicker"><i class="bi bi-pencil-square"></i> FORMULARIO DE ALTA</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/responsable/unidades}" class="btn btn-outline-light btn-sm rounded-pill px-3" style="border-color: var(--border-subtle); color: #cbd5e1;">
                <i class="bi bi-arrow-left me-1"></i> Volver a Mis Unidades
            </a>
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3" style="border-color: var(--border-subtle); color: #cbd5e1;">
                <i class="bi bi-box-arrow-up-right me-1"></i> Vista Pública
            </a>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="admin-content">

        <!-- HEADER SECCIÓN -->
        <div class="mb-4 pb-2 border-bottom border-secondary border-opacity-25">
            <h2 class="fw-bold text-white m-0" th:text="${tieneResponsable} ? 'Registrar otra unidad de venta' : 'Registrar unidad de venta'">Registrar Unidad</h2>
            <p class="text-secondary small m-0 mt-1"
               th:text="${tieneResponsable}
                        ? 'La nueva unidad se asociará al perfil de responsable con el que iniciaste sesión.'
                        : 'Ingresá los datos del puesto y su responsable. Se vincularán a la cuenta activa.'"></p>
        </div>

        <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>

            <!-- ERRORES GLOBALES -->
            <div class="alert-danger-custom" th:if="${#fields.hasErrors('*')}">
                <strong><i class="bi bi-exclamation-triangle-fill me-2"></i>Revisá estos datos:</strong>
                <ul class="mb-0 mt-2">
                    <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
                </ul>
            </div>

            <!-- 1. RESPONSABLE (SOLO SI NO TIENE RESPONSABLE CARGADO) -->
            <div class="dark-card" th:unless="${tieneResponsable}">
                <div class="dark-card-header">
                    <span><i class="bi bi-person-badge me-2" style="color: var(--coral-primary);"></i>1. Datos del Responsable</span>
                </div>
                <div class="p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="apellido">Apellido</label>
                            <input type="text" id="apellido" class="form-control" th:field="*{apellido}"
                                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{apellido}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="dni">DNI</label>
                            <input type="text" id="dni" class="form-control" th:field="*{dni}"
                                   th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dni}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                            <input type="date" id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}"
                                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="fechaIngreso">Fecha de ingreso</label>
                            <input type="date" id="fechaIngreso" class="form-control" th:field="*{fechaIngreso}"
                                   th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="tipoEmpleado">Tipo de empleado</label>
                            <select id="tipoEmpleado" class="form-select" th:field="*{tipoEmpleado}">
                                <option th:each="t : ${tiposEmpleado}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <div class="col-md-6" id="bloqueCocinero">
                            <label class="form-label" for="rolCocina">Rol en la cocina</label>
                            <select id="rolCocina" class="form-select" th:field="*{rolCocina}">
                                <option th:each="r : ${rolesCocina}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>

                        <div class="col-md-6" id="bloqueCajero">
                            <label class="form-label" for="turno">Turno</label>
                            <select id="turno" class="form-select" th:field="*{turno}">
                                <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. UNIDAD DE VENTA -->
            <div class="dark-card">
                <div class="dark-card-header">
                    <span><i class="bi bi-shop me-2" style="color: var(--coral-primary);"></i>
                        <span th:text="${tieneResponsable} ? 'Datos de la Unidad de Venta' : '2. Datos de la Unidad de Venta'">Unidad de venta</span>
                    </span>
                </div>
                <div class="p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="nombreComercial">Nombre comercial</label>
                            <input type="text" id="nombreComercial" class="form-control" th:field="*{nombreComercial}"
                                   placeholder="Ej: Street Burger"
                                   th:classappend="${#fields.hasErrors('nombreComercial')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="codigoUnico">Código único (10 caracteres, empieza con FT o PD)</label>
                            <input type="text" id="codigoUnico" class="form-control" th:field="*{codigoUnico}"
                                   placeholder="Ej: FT12345678"
                                   th:classappend="${#fields.hasErrors('codigoUnico')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{codigoUnico}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="superficie">Superficie (m²)</label>
                            <input type="number" step="0.01" min="0" id="superficie" class="form-control"
                                   placeholder="Ej: 25.5"
                                   th:field="*{superficie}"
                                   th:classappend="${#fields.hasErrors('superficie')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{superficie}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="tipoUnidad">Tipo de unidad</label>
                            <select id="tipoUnidad" class="form-select" th:field="*{tipoUnidad}">
                                <option th:each="t : ${tiposUnidad}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <!-- CAMPOS FOOD TRUCK -->
                        <div class="col-12" id="bloqueFoodTruck">
                            <div class="row g-3 p-3 rounded-3" style="background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border-subtle);">
                                <div class="col-md-6">
                                    <label class="form-label" for="patente">Patente</label>
                                    <input type="text" id="patente" class="form-control" th:field="*{patente}"
                                           placeholder="Ej: AB123CD"
                                           th:classappend="${#fields.hasErrors('patente')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{patente}"></div>
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input type="checkbox" id="requiereElectricidad" class="form-check-input"
                                               th:field="*{requiereElectricidad}">
                                        <label class="form-check-label" for="requiereElectricidad">
                                            Requiere conexión eléctrica (+ $2.000)
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CAMPOS PUESTO DESARMABLE -->
                        <div class="col-12" id="bloquePuesto">
                            <div class="row g-3 p-3 rounded-3" style="background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border-subtle);">
                                <div class="col-md-6">
                                    <label class="form-label" for="cantCarpas">Cantidad de carpas</label>
                                    <input type="number" id="cantCarpas" class="form-control" th:field="*{cantCarpas}"
                                           placeholder="Ej: 2"
                                           th:classappend="${#fields.hasErrors('cantCarpas')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{cantCarpas}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="tiempoMontajeMinutos">Tiempo de montaje (minutos)</label>
                                    <input type="number" id="tiempoMontajeMinutos" class="form-control" th:field="*{tiempoMontajeMinutos}"
                                           placeholder="Ej: 45"
                                           th:classappend="${#fields.hasErrors('tiempoMontajeMinutos')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{tiempoMontajeMinutos}"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="d-flex align-items-center gap-3 mt-4">
                <button type="submit" class="btn-palo-primary">
                    <i class="bi bi-check-lg"></i> Registrar Unidad
                </button>
                <a class="btn btn-outline-light rounded-pill px-4" style="border-color: var(--border-subtle); color: #cbd5e1;" 
                   th:href="@{/responsable/unidades}" th:if="${tieneResponsable}">
                    Cancelar
                </a>
                <a class="btn btn-outline-light rounded-pill px-4" style="border-color: var(--border-subtle); color: #cbd5e1;" 
                   th:href="@{/}" th:unless="${tieneResponsable}">
                    Cancelar
                </a>
            </div>

        </form>

    </main>
</div>

<!-- SCRIPTS DINÁMICOS -->
<script>
    function mostrar(id, visible) {
        var el = document.getElementById(id);
        if (el) el.style.display = visible ? '' : 'none';
    }

    function actualizar() {
        var tipoEmp = document.getElementById('tipoEmpleado');
        if (tipoEmp) {
            var cocinero = tipoEmp.value === 'COCINERO';
            mostrar('bloqueCocinero', cocinero);
            mostrar('bloqueCajero', !cocinero);
        }
        var tipoUni = document.getElementById('tipoUnidad');
        if (tipoUni) {
            var foodTruck = tipoUni.value === 'FOOD_TRUCK';
            mostrar('bloqueFoodTruck', foodTruck);
            mostrar('bloquePuesto', !foodTruck);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        var a = document.getElementById('tipoEmpleado');
        var b = document.getElementById('tipoUnidad');
        if (a) a.addEventListener('change', actualizar);
        if (b) b.addEventListener('change', actualizar);
        actualizar();
    });
    window.addEventListener('pageshow', actualizar);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
