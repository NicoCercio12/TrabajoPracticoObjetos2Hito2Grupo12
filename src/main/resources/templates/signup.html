<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-header card-header-eg">Crear cuenta</div>
                <div class="card-body p-4">
                    <form th:action="@{/signup}" th:object="${cuenta}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmarPassword">Repetir contraseña</label>
                            <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                    </form>
                    <p class="text-center small mb-0 mt-3">
                        ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciar sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
