<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Festivales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Epicentro Gourmet</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary" th:text="${titulo}">Festivales Registrados</h2>
    </div>

    <!-- Alerta si no hay festivales cargados -->
    <div th:if="${#lists.isEmpty(festivales)}" class="alert alert-info">
        No hay festivales registrados actualmente en el sistema.
    </div>

    <!-- Tabla de festivales -->
    <div class="card shadow-sm" th:unless="${#lists.isEmpty(festivales)}">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Temporada</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Duración</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fest, stat : ${festivales}">
                        <td th:text="${stat.count}">1</td>
                        <td class="fw-bold" th:text="${fest.nombre}">Primavera Fest</td>
                        <td th:text="${fest.temporada}">Primavera</td>
                        <td th:text="${#temporals.format(fest.fechaInicio, 'dd/MM/yyyy')}">01/09/2026</td>
                        <td th:text="${#temporals.format(fest.fechaFin, 'dd/MM/yyyy')}">15/09/2026</td>
                        <td th:text="|${fest.duracionDias} días|">15 días</td>
                        <td>
                            <span th:if="${fest.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${fest.activo}" class="badge bg-secondary">Finalizado / Inactivo</span>
                        </td>
                        <td class="text-center">
                            <!-- Enlace para el Caso de Uso 2: Ver Unidades -->
                            <a th:href="@{/festivales/{id}/unidades(id=${fest.id})}" class="btn btn-sm btn-outline-primary">
                                Ver Unidades
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
