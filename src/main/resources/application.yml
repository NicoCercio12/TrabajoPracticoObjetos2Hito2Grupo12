server:
  port: 8080

spring:
  application:
    name: epicentro-gourmet

  datasource:

    url: jdbc:mysql://localhost:3306/epicentro_gourmet?createDatabaseIfNotExist=true

    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true


  thymeleaf:
    cache: false